name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  release:
    name: 发布 Windows 版本
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install

      - name: 构建 Tauri 应用
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 验证密钥
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "❌ TAURI_SIGNING_PRIVATE_KEY 未设置" -ForegroundColor Red
            exit 1
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            Write-Host "❌ TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未设置" -ForegroundColor Red
            exit 1
          }

          Write-Host "✅ TAURI_SIGNING_PRIVATE_KEY length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length)" -ForegroundColor Green
          Write-Host "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set" -ForegroundColor Green

          # 调试：显示私钥前缀（不泄露完整内容）
          $keyPreview = $env:TAURI_SIGNING_PRIVATE_KEY.Substring(0, [Math]::Min(30, $env:TAURI_SIGNING_PRIVATE_KEY.Length))
          Write-Host "Key preview: $keyPreview..." -ForegroundColor Cyan

          # 构建
          bun tauri build

          # 检查签名文件是否生成
          Write-Host "=== 检查 .sig 文件 ===" -ForegroundColor Cyan
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.sig" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "✅ Found: $($_.FullName)" -ForegroundColor Green
          }

      - name: 读取发布说明
        id: release-notes
        shell: pwsh
        run: |
          $body = "Second Desk ${{ github.ref_name }} released."
          if (Test-Path "RELEASE_NOTES.md") {
            $fullContent = Get-Content "RELEASE_NOTES.md" -Raw -Encoding UTF8
            $sections = $fullContent -split '(?m)^---\s*$'
            $body = $sections[0].Trim()
            Write-Host "Loaded release notes from RELEASE_NOTES.md"
          } else {
            Write-Host "No RELEASE_NOTES.md found, using default message"
          }
          "BODY<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 准备发布资产
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "${{ github.ref_name }}"

          Write-Host "=== Bundle 目录文件列表 ===" -ForegroundColor Cyan
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

          # MSI 安装包
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $destName = "SecondDesk-$VERSION-Windows.msi"
            Copy-Item $msi.FullName "release-assets/$destName"
            Write-Host "✓ MSI copied: $destName" -ForegroundColor Green

            # MSI 签名文件
            $msiSig = "$($msi.FullName).sig"
            if (Test-Path $msiSig) {
              Copy-Item $msiSig "release-assets/$destName.sig"
              Write-Host "✓ MSI signature copied: $destName.sig" -ForegroundColor Green
            } else {
              Write-Host "⚠ MSI signature not found" -ForegroundColor Yellow
            }
          } else {
            Write-Host "⚠ MSI not found" -ForegroundColor Yellow
          }

          # NSIS 安装包
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $destName = "SecondDesk-$VERSION-Windows-Setup.exe"
            Copy-Item $nsis.FullName "release-assets/$destName"
            Write-Host "✓ NSIS copied: $destName" -ForegroundColor Green

            # NSIS 签名文件
            $nsisSig = "$($nsis.FullName).sig"
            if (Test-Path $nsisSig) {
              Copy-Item $nsisSig "release-assets/$destName.sig"
              Write-Host "✓ NSIS signature copied: $destName.sig" -ForegroundColor Green
            }
          }

          Write-Host "=== 准备上传的文件 ===" -ForegroundColor Cyan
          Get-ChildItem -Path "release-assets" | ForEach-Object { Write-Host $_.Name }

      - name: 上传发布资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Second Desk ${{ github.ref_name }}'
          body: ${{ steps.release-notes.outputs.BODY }}
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 调试输出
        if: always()
        shell: bash
        run: |
          echo "=== 查找所有 .sig 文件 ==="
          find src-tauri/target -name "*.sig" 2>/dev/null || echo "No .sig files found"

  # 生成 latest.json（在发布完成后从 Release 下载签名文件）
  assemble-latest-json:
    name: 生成 latest.json
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY" || true
          echo "=== 下载的文件 ==="
          ls -la dl || true

      - name: 生成 latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"

          # 读取发布说明
          NOTES="Second Desk $TAG released."
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES=$(awk '/^---/{exit} {print}' RELEASE_NOTES.md)
          fi

          win_url=""
          win_sig=""

          # 查找 Windows MSI 签名
          shopt -s nullglob
          for sig in dl/*.msi.sig; do
            base="${sig%.sig}"
            fname=$(basename "$base")
            win_url="$base_url/$fname"
            win_sig=$(cat "$sig" | tr -d '\r\n')
            echo "Found Windows MSI signature: $fname"
            break
          done

          # 如果没有 MSI 签名，尝试 NSIS
          if [ -z "$win_sig" ]; then
            for sig in dl/*.exe.sig; do
              base="${sig%.sig}"
              fname=$(basename "$base")
              win_url="$base_url/$fname"
              win_sig=$(cat "$sig" | tr -d '\r\n')
              echo "Found Windows NSIS signature: $fname"
              break
            done
          fi

          # 如果没有签名，使用 MSI 文件 URL（无签名）
          if [ -z "$win_url" ]; then
            for msi in dl/*.msi; do
              fname=$(basename "$msi")
              win_url="$base_url/$fname"
              echo "Using MSI without signature: $fname"
              break
            done
          fi

          if [ -z "$win_sig" ]; then
            echo "⚠ 未找到签名文件，自动更新功能将无法工作"
          fi

          # 生成 latest.json (使用 jq)
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Second Desk $TAG" \
            --arg pub_date "$PUB_DATE" \
            --arg sig "$win_sig" \
            --arg url "$win_url" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $sig,
                  url: $url
                }
              }
            }' > latest.json

          echo "=== Generated latest.json ==="
          cat latest.json

      - name: 上传 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  # 发布完成通知
  notify:
    name: 发布完成
    needs: [release, assemble-latest-json]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 发布成功
        run: |
          echo "✅ Second Desk ${{ github.ref_name }} 已成功发布到 GitHub Releases"
          echo "📦 下载地址: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
