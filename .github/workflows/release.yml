name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v0.1.0 等

env:
  RUST_BACKTRACE: 1

# 授予 GITHUB_TOKEN 创建 Release 的权限
permissions:
  contents: write

jobs:
  release:
    name: 发布 Windows 版本
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install

      - name: 验证签名密钥
        shell: pwsh
        run: |
          $failed = $false
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "✓ TAURI_SIGNING_PRIVATE_KEY is set (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))" -ForegroundColor Green
          } else {
            Write-Host "✗ TAURI_SIGNING_PRIVATE_KEY is NOT set!" -ForegroundColor Red
            $failed = $true
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            Write-Host "✓ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set" -ForegroundColor Green
          } else {
            Write-Host "✗ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is NOT set!" -ForegroundColor Red
            $failed = $true
          }
          if ($failed) {
            Write-Host "签名密钥缺失，请在 GitHub Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -ForegroundColor Red
            exit 1
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 读取发布说明
        id: release-notes
        shell: pwsh
        run: |
          $body = "Second Desk ${{ github.ref_name }} released."
          if (Test-Path "RELEASE_NOTES.md") {
            $fullContent = Get-Content "RELEASE_NOTES.md" -Raw -Encoding UTF8
            $sections = $fullContent -split '(?m)^---\s*$'
            $body = $sections[0].Trim()
            Write-Host "Loaded release notes from RELEASE_NOTES.md"
          } else {
            Write-Host "No RELEASE_NOTES.md found, using default message"
          }
          # 写入 GitHub Actions 输出（处理多行）
          "BODY<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Second Desk ${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.BODY }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: false

  # 发布完成通知
  notify:
    name: 发布完成
    needs: release
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 发布成功
        run: |
          echo "✅ Second Desk ${{ github.ref_name }} 已成功发布到 GitHub Releases"
          echo "📦 下载地址: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
