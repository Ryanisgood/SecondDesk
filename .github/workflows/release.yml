name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v0.1.0 等

env:
  RUST_BACKTRACE: 1

# 授予 GITHUB_TOKEN 创建 Release 的权限
permissions:
  contents: write

jobs:
  release:
    name: 发布 Windows 版本
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install

      - name: 验证签名密钥
        shell: pwsh
        run: |
          $failed = $false
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "✓ TAURI_SIGNING_PRIVATE_KEY is set (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))" -ForegroundColor Green
          } else {
            Write-Host "✗ TAURI_SIGNING_PRIVATE_KEY is NOT set!" -ForegroundColor Red
            $failed = $true
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            Write-Host "✓ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set" -ForegroundColor Green
          } else {
            Write-Host "✗ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is NOT set!" -ForegroundColor Red
            $failed = $true
          }
          if ($failed) {
            Write-Host "签名密钥缺失，请在 GitHub Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -ForegroundColor Red
            exit 1
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Second Desk ${{ github.ref_name }}'
          releaseBody: |
            ## 🎉 Second Desk ${{ github.ref_name }} 发布

            ### 📦 下载安装包（Windows 专用）

            - **`.msi`** - Windows 安装程序（推荐）
            - **`.exe`** - NSIS 安装程序

            ### 💡 安装说明

            1. 下载 `.msi` 文件（推荐）
            2. 双击运行安装程序
            3. 按照向导完成安装

            ### 🔧 系统要求

            - Windows 10/11（64位）
            - WebView2 运行时（Windows 11 自带）

            ---

            **完整更新日志**: https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...HEAD
          releaseDraft: false
          prerelease: false

      - name: 生成 latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $date = Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ"

          # 调试：列出 bundle 目录下所有文件
          Write-Host "=== 调试：bundle 目录所有文件 ===" -ForegroundColor Cyan
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

          # 读取发布说明（如果存在）
          $body = "Release ${{ github.ref_name }}"
          if (Test-Path "RELEASE_NOTES.md") {
            $fullContent = Get-Content "RELEASE_NOTES.md" -Raw -Encoding UTF8
            $sections = $fullContent -split '(?m)^---\s*$'
            $body = $sections[0].Trim()
            Write-Host "Loaded release notes from RELEASE_NOTES.md (first section)"
          } else {
            Write-Host "No RELEASE_NOTES.md found, using default message"
          }

          # Tauri v2：签名文件是 .msi.zip.sig，更新包是 .msi.zip
          $msiZipFile = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi.zip.sig" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($msiZipFile -and $sigFile) {
            $signature = Get-Content $sigFile.FullName -Raw
            $msiZipFileName = $msiZipFile.Name

            $latestJson = @{
              version = $version
              date = $date
              platforms = @{
                "windows-x86_64" = @{
                  signature = $signature.Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$msiZipFileName"
                }
              }
              notes = $body
            } | ConvertTo-Json -Depth 4

            $latestJson | Out-File -FilePath "latest.json" -Encoding UTF8NoBOM
            Write-Host "Generated latest.json for $msiZipFileName"
          } else {
            Write-Host "msi.zip file: $($msiZipFile)" -ForegroundColor Yellow
            Write-Host "sig file: $($sigFile)" -ForegroundColor Yellow
            Write-Host "MSI zip or signature not found! Tauri v2 should generate .msi.zip and .msi.zip.sig files." -ForegroundColor Red
            Write-Host "Please verify TAURI_SIGNING_PRIVATE_KEY is a valid minisign private key." -ForegroundColor Red
            exit 1
          }

      - name: 上传 latest.json 到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: latest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # 发布完成通知
  notify:
    name: 发布完成
    needs: release
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 发布成功
        run: |
          echo "✅ Second Desk ${{ github.ref_name }} 已成功发布到 GitHub Releases"
          echo "📦 下载地址: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
